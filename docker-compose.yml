version: "3.9"

services:
  api:
    build: .
    image: notion-health-ai:latest
    container_name: notion-health-ai
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # HF token passed from host env or docker secret — never baked into image
      - HUGGING_FACE_TOKEN=${HUGGING_FACE_TOKEN:-}
    volumes:
      # Persist generated visualizations and logs on the host
      - ./visualizations:/app/visualizations
      - ./logs:/app/logs
      # TRIBEv2 model cache — avoids re-downloading weights on every restart
      - tribev2-cache:/app/cache
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  tribev2-cache:
    driver: local
